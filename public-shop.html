<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSEL - Public Materials</title>
<link rel="icon" href="logo.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f172a;color:#fff;padding:12px}
.header{background:#00924C;border-radius:14px;padding:16px;display:flex;justify-content:space-between;align-items:center}
.card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:14px;text-align:center}
.card img{width:100%;height:110px;object-fit:contain;background:#fff;border-radius:10px;padding:8px}
.price{color:#22c55e;font-weight:900;margin-top:6px;font-size:18px}
.btn{width:100%;padding:10px;border-radius:10px;border:0;background:#22c55e;color:#0f172a;font-weight:800;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:15px}
</style>
</head>
<body>
<div class="header"><div><b>MSEL PUBLIC SHOP</b><br><small>For All Customers</small></div><a href="index.html" style="background:#fff;color:#00924C;padding:8px 14px;border-radius:20px;text-decoration:none;font-weight:800">Home</a></div>
<div id="grid" class="grid">Loading...</div>
<script>
const SUPABASE_URL='https://rsnsciisycruhxtvfhwb.supabase.co';
const SUPABASE_KEY='sb_publishable_s38AGGB3mnHpRMIDkVsfow_bs-Fz00g';
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
async function load(){
 let {data}=await supabaseClient.from('msel_public_products').select('*').order('created_at',{ascending:false});
 let all=data||[];
 if(all.length===0) all=[{name:"Biodigester Bag 1M³",price:"95000",description:"Public price",badge:"PUBLIC",img:""},{name:"Storage Bag 10,000L",price:"280000",description:"Public",badge:"BIG",img:""}];
 let h='';
 all.forEach(p=>{
   let img=p.img||'logo.png';
   h+=`<div class="card"><span style="font-size:10px;background:#22c55e;color:#000;padding:4px 8px;border-radius:20px">${p.badge}</span><img src="${img}"><div style="font-weight:800;margin-top:8px">${p.name}</div><div style="font-size:11px;opacity:.6">${p.description}</div><div class="price">₦${p.price}</div><button class="btn" onclick="window.open('https://wa.me/2347011620564?text=Hi MSEL I want ${p.name}','_blank')">Order on WhatsApp</button></div>`;
 });
 document.getElementById('grid').innerHTML=h;
}
load();
</script>
</body>
</html>
