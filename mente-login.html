<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>MSEL MENTE Login</title>
<link rel="icon" href="logo.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:15px;color:#fff}
.card{background:#1e293b;width:100%;max-width:400px;padding:22px;border-radius:18px;border:2px solid #334155;text-align:center}
.card img{height:55px;margin-bottom:10px}
.card h2{color:#22c55e;margin:10px 0;font-size:18px}
input{width:100%;padding:13px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:#fff;outline:none;margin-bottom:12px;font-size:14px}
button{width:100%;padding:14px;background:#22c55e;color:#000;border:0;border-radius:12px;font-weight:900;font-size:15px;cursor:pointer}
a{color:#22c55e;text-decoration:none;font-weight:900}
</style>
</head>
<body>
<div class="card">
<img src="logo.png" alt="MSEL">
<h2>Login to MENTE Chat</h2>
<input id="loginInput" type="text" placeholder="WhatsApp / Username">
<button id="loginBtn" onclick="login()">Login</button>
<p style="margin-top:14px;font-size:12px"><a href="mente-register.html">Create Account</a></p>
<p id="msg" style="margin-top:10px;font-size:13px;color:#FFC72C"></p>
</div>
<script>
const SUPABASE_URL='https://rsnsciisycruhxtvfhwb.supabase.co';
const SUPABASE_KEY='sb_publishable_s38AGGB3mnHpRMIDkVsfow_bs-Fz00g';
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

async function login(){
 let raw=document.getElementById('loginInput').value.trim().replace(/\s+/g,'').toLowerCase();
 let msg=document.getElementById('msg');
 let btn=document.getElementById('loginBtn');
 if(!raw){ msg.innerText='Enter WhatsApp / Username'; return; }
 btn.innerText='Checking...';
 try{
  let {data,error}=await supabaseClient.from('msel_mente_accounts').select('*').or(`msel_whatsapp.eq.${raw},username.eq.${raw},msel_whatsapp.ilike.%${raw}%,username.ilike.%${raw}%`);
  if(error) throw error;
  if(!data||data.length===0){
   let alt=raw.startsWith('0')?raw.slice(1):'0'+raw;
   let {data:d2}=await supabaseClient.from('msel_mente_accounts').select('*').or(`msel_whatsapp.eq.${alt},username.eq.${alt}`);
   data=d2;
  }
  if(!data||data.length===0){ msg.innerText='Account not found'; btn.innerText='Login'; return; }
  let acc=data[0];
  let status=(acc.approval_status||'pending').toLowerCase();
  if(status==='pending'){ msg.innerText='Awaiting Approval'; btn.innerText='Login'; return; }
  if(status==='rejected'){ msg.innerText='Rejected'; btn.innerText='Login'; return; }
  localStorage.setItem('msel_mente_session', JSON.stringify({
    name:acc.full_name||acc.name, full_name:acc.full_name, phone:acc.phone, msel_whatsapp:acc.msel_whatsapp, username:acc.username, role:acc.role||'mente'
  }));
  msg.innerText='Welcome '+ (acc.full_name||acc.name);
  setTimeout(()=>{ location.href='mente-chat.html'; },800);
 }catch(e){ msg.innerText='Error: '+e.message; btn.innerText='Login'; }
}
</script>
</body>
</html>
