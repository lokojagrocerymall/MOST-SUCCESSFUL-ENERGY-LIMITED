<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSEL - Admin Panel</title><link rel="icon" href="logo.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f172a;color:#fff;padding:15px}
.container{max-width:900px;margin:0 auto}
.card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:20px;margin-bottom:18px}
input,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;margin-top:10px}
button{padding:12px 18px;border-radius:10px;border:0;font-weight:800;cursor:pointer;margin-top:10px}
.btn-green{background:#22c55e;color:#0f172a;width:100%}
.btn-orange{background:#E67E22;color:#fff}
.btn-red{background:#ef4444;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:15px}
.item{background:#0f172a;border:1px solid #334155;border-radius:10px;padding:10px}
.item img,.item video{width:100%;border-radius:8px;max-height:200px;object-fit:cover}
.hidden{display:none}
</style>
</head>
<body>
<div class="container">
<div class="card" style="text-align:center;background:#00924C"><h1>🔐 MSEL ADMIN PANEL</h1><p>Pictures & Videos Upload</p></div>
<div id="loginBox" class="card"><h3>Admin Login</h3><input id="adminCode" placeholder="Enter Code: MSELADMIN2026"><button class="btn-green" onclick="adminLogin()">Login as Admin</button></div>
<div id="adminBox" class="hidden">
<div class="card"><h3>📸 Upload Pictures</h3><input type="file" id="picFile" accept="image/*" multiple><input id="picTitle" placeholder="Title e.g. Maryland Project"><button class="btn-green" onclick="addPics()">Add Pictures</button></div>
<div class="card"><h3>🎥 Add YouTube Video</h3><input id="ytLink" placeholder="YouTube Link"><input id="ytTitle" placeholder="Video Title"><button class="btn-orange" style="background:#E67E22;width:100%" onclick="addYT()">Add YouTube Video</button><br><br><p>Or Upload Video File</p><input type="file" id="vidFile" accept="video/*"><input id="vidTitle" placeholder="Video Title"><button class="btn-green" onclick="addVideoFile()">Upload Video File</button></div>
<div class="card"><h3>📦 Add New Material (WhatsApp catalog)</h3><input id="prodName" placeholder="Product Name"><input id="prodPrice" placeholder="Price e.g. 250000"><input id="prodDesc" placeholder="Description"><button class="btn-green" onclick="addProduct()">Add to Engineers Shop</button><div id="productList"></div></div>
<div class="card"><h3>🖼️ Current Gallery Preview</h3><div id="galleryPreview" class="grid"></div></div>
<button class="btn-red" style="width:100%" onclick="logout()">Logout</button>
</div>
</div>
<script>
let gallery=JSON.parse(localStorage.getItem('msel_gallery')||'[]');
let products=JSON.parse(localStorage.getItem('msel_products')||'[]');
function adminLogin(){let v=document.getElementById('adminCode').value.trim();if(v==='MSELADMIN2026'||v==='MSEL2024'||v==='07011620564'){localStorage.setItem('msel_admin','yes');showAdmin();}else alert('Wrong Code!');}
function showAdmin(){document.getElementById('loginBox').classList.add('hidden');document.getElementById('adminBox').classList.remove('hidden');renderGallery();renderProducts();}
function logout(){localStorage.removeItem('msel_admin');location.reload();}
function renderGallery(){let html='';gallery.forEach((g,i)=>{if(g.type==='image')html+=`<div class="item"><img src="${g.src}"><p>${g.title}</p><button class="btn-red" style="width:100%" onclick="delItem(${i})">Delete</button></div>`;else if(g.type==='youtube')html+=`<div class="item"><iframe width="100%" height="150" src="${g.embed}" frameborder="0" allowfullscreen></iframe><p>${g.title}</p><button class="btn-red" style="width:100%" onclick="delItem(${i})">Delete</button></div>`;else html+=`<div class="item"><video src="${g.src}" controls></video><p>${g.title}</p><button class="btn-red" style="width:100%" onclick="delItem(${i})">Delete</button></div>`});document.getElementById('galleryPreview').innerHTML=html||'No items';}
function delItem(i){gallery.splice(i,1);localStorage.setItem('msel_gallery',JSON.stringify(gallery));renderGallery();}
function addPics(){let files=document.getElementById('picFile').files;let title=document.getElementById('picTitle').value||'MSEL Project';for(let f of files){let r=new FileReader();r.onload=e=>{gallery.push({type:'image',src:e.target.result,title:title});localStorage.setItem('msel_gallery',JSON.stringify(gallery));renderGallery();};r.readAsDataURL(f);}alert('Added!');}
function addYT(){let link=document.getElementById('ytLink').value.trim();let title=document.getElementById('ytTitle').value||'MSEL Video';let embed=link.replace('youtu.be/','www.youtube.com/embed/').replace('watch?v=','embed/');gallery.push({type:'youtube',embed:embed,title:title});localStorage.setItem('msel_gallery',JSON.stringify(gallery));renderGallery();}
function addVideoFile(){let file=document.getElementById('vidFile').files[0];let title=document.getElementById('vidTitle').value||'MSEL Video';let r=new FileReader();r.onload=e=>{gallery.push({type:'video',src:e.target.result,title:title});localStorage.setItem('msel_gallery',JSON.stringify(gallery));renderGallery();};r.readAsDataURL(file);}
function renderProducts(){let h='';products.forEach((p,i)=>{h+=`<div style="background:#0f172a;padding:8px;border-radius:8px;margin-top:6px;display:flex;justify-content:space-between"><span><b>${p.name}</b> - ₦${p.price}</span><button class="btn-red" onclick="delProd(${i})">X</button></div>`});document.getElementById('productList').innerHTML=h;}
function addProduct(){let n=document.getElementById('prodName').value,pr=document.getElementById('prodPrice').value,d=document.getElementById('prodDesc').value;if(!n||!pr)return;products.push({name:n,price:pr,desc:d});localStorage.setItem('msel_products',JSON.stringify(products));renderProducts();alert('Product added!');}
function delProd(i){products.splice(i,1);localStorage.setItem('msel_products',JSON.stringify(products));renderProducts();}
if(localStorage.getItem('msel_admin')==='yes')showAdmin();
</script>
</body>
</html>
