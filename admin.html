<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSEL Admin Panel</title>
<link rel="icon" href="logo.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f172a;color:#fff;padding:10px}
.top{background:#00924C;border-radius:14px;padding:14px;display:flex;justify-content:space-between;align-items:center}
.top h2{font-size:18px;line-height:1.2}
.top a{background:#fff;color:#00924C;padding:8px 16px;border-radius:20px;text-decoration:none;font-weight:800;font-size:13px}
.box{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:16px;margin-top:12px}
.box h3{font-size:16px;margin-bottom:10px}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;margin-top:8px;outline:none}
textarea{resize:vertical;min-height:60px}
button{width:100%;padding:12px;border-radius:10px;border:0;background:#22c55e;color:#0f172a;font-weight:800;margin-top:10px;cursor:pointer}
button:disabled{opacity:.5}
.btn-orange{background:#f97316;color:#fff}
.preview{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-top:10px}
.preview div{background:#0f172a;border-radius:10px;overflow:hidden;border:1px solid #334155;padding-bottom:6px;text-align:center;font-size:11px}
.preview img,.preview video{width:100%;height:90px;object-fit:cover}
.mini-badge{display:inline-block;background:#22c55e;color:#000;font-size:9px;padding:2px 6px;border-radius:10px;font-weight:800;margin-bottom:3px}
.img-previews{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.img-previews img{width:70px;height:70px;object-fit:cover;border-radius:8px;border:1px solid #22c55e}
</style>
</head>
<body>

<div class="top">
<h2>🔐 MSEL ADMIN PANEL</h2>
<a href="index.html">🏠 Homepage</a>
</div>

<div class="box">
<h3>📸 Upload Pictures</h3>
<input type="file" id="picFiles" multiple accept="image/*">
<input type="text" id="picTitle" placeholder="Title e.g. Maryland Project">
<button id="picBtn" onclick="addPictures()">Add Pictures</button>
<small id="picStatus" style="display:block;margin-top:6px;color:#94a3b8"></small>
</div>

<div class="box">
<h3>🎥 Add YouTube Video</h3>
<input type="text" id="ytLink" placeholder="YouTube Link">
<input type="text" id="ytTitle" placeholder="Video Title">
<button class="btn-orange" onclick="addYT()">Add YouTube Video</button>
<div style="height:1px;background:#334155;margin:14px 0"></div>
<input type="file" id="vidFile" accept="video/*">
<input type="text" id="vidTitle" placeholder="Video Title">
<button id="vidBtn" onclick="addVideoFile()">Upload Video File</button>
<small id="vidStatus" style="display:block;margin-top:6px;color:#94a3b8"></small>
</div>

<div class="box" style="border:1.5px solid #22c55e">
<h3>📦 Add / Edit Material - MULTIPLE IMAGES</h3>
<input type="hidden" id="editIndex" value="-1">
<input type="text" id="prodName" placeholder="Product Name e.g. Biogas Solar Pump">
<input type="text" id="prodPrice" placeholder="Price e.g. 165,000">
<textarea id="prodDesc" placeholder="Description e.g. Comes with solar panel. Complete system"></textarea>
<select id="prodBadge">
<option value="NEW">NEW</option>
<option value="BIG STORAGE">BIG STORAGE</option>
<option value="HOT">HOT</option>
<option value="KIT">KIT</option>
<option value="SEAL">SEAL</option>
<option value="WC">WC</option>
<option value="SALE">SALE</option>
</select>

<label style="display:block;margin-top:10px;font-size:13px;color:#22c55e;font-weight:800">📸 Product Images (up to 5 images):</label>
<input type="file" id="prodImage" multiple accept="image/*" onchange="previewProdImages(this)">
<div id="prodImgPreview" class="img-previews"></div>
<small style="color:#94a3b8;font-size:11px">Select multiple images at once. First image = main image.</small>

<button id="prodBtn" onclick="addProduct()">Add to Shop</button>
<button onclick="clearProdForm()" style="background:#334155;color:#fff">Clear Form</button>
<small id="prodStatus" style="display:block;margin-top:6px;color:#94a3b8"></small>
</div>

<div class="box">
<h3>🛒 Current Products - <span id="prodCount">0 items</span></h3>
<div id="mentePreview" class="preview"></div>
</div>

<div class="box">
<h3>🖼️ Current Gallery - <span id="count">0 items</span></h3>
<div id="preview" class="preview"></div>
<button onclick="clearGallery()" style="background:#ef4444;color:#fff;margin-top:12px">🗑️ Clear Gallery</button>
</div>

<button onclick="logout()" style="background:#ef4444;color:#fff;margin:12px 0">Logout</button>
<a href="index.html" style="display:block;text-align:center;background:#fff;color:#00924C;padding:12px;border-radius:10px;text-decoration:none;font-weight:800">🏠 Go to Homepage</a>

<script>
const SUPABASE_URL = 'https://rsnsciisycruhxtvfhwb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_s38AGGB3mnHpRMIDkVsfow_bs-Fz00g';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const BUCKET = 'msel-project';

let gallery = JSON.parse(localStorage.getItem('msel_gallery')||'[]');
let products = JSON.parse(localStorage.getItem('msel_products')||'[]');

const DEFAULT_PRODUCTS = [
  {name:'Biogas Solar Pump',price:'165000',desc:'Comes with solar panel. Complete system. Pump water with biogas',badge:'SALE',img:'',imgs:[]},
  {name:'Solar Water Pump Kit',price:'195000',desc:'Solar powered water pump with panel and controller',badge:'NEW',img:'',imgs:[]},
  {name:'10,000L Storage Bag',price:'250000',desc:'Big industrial bag',badge:'BIG STORAGE',img:''},
  {name:'Biodigester Bag 1M³',price:'85000',desc:'High density digester bag',badge:'HOT',img:''},
  {name:'Air Vent & Cover',price:'8000',desc:'Odorless vent system',badge:'NEW',img:''},
  {name:'1M³ Digester Complete Kit',price:'180000',desc:'Everything for 1M³ system',badge:'KIT',img:''},
  {name:'Sealant & Additives',price:'12000',desc:'Waterproof sealant',badge:'SEAL',img:''},
  {name:'WC Connector',price:'6000',desc:'Toilet connector',badge:'WC',img:''}
];

if(products.length===0){
  products = DEFAULT_PRODUCTS;
  localStorage.setItem('msel_products', JSON.stringify(products));
} else if(products.length===6){
  let hasPump = products.some(p=>p.name.toLowerCase().includes('solar pump'));
  if(!hasPump){
    products.unshift(DEFAULT_PRODUCTS[1]);
    products.unshift(DEFAULT_PRODUCTS[0]);
    localStorage.setItem('msel_products', JSON.stringify(products));
  }
}

function save(){localStorage.setItem('msel_gallery',JSON.stringify(gallery));render();}
function saveProducts(){localStorage.setItem('msel_products',JSON.stringify(products));renderProducts();}

async function uploadToSupabase(file, folder=''){
  const prefix = folder? folder + '/' : '';
  const name = prefix + Date.now()+'_'+Math.random().toString(36).slice(2,6)+'_'+file.name.replace(/\s+/g,'_');
  const {error} = await supabaseClient.storage.from(BUCKET).upload(name, file, {upsert:true});
  if(error) throw error;
  const {data} = supabaseClient.storage.from(BUCKET).getPublicUrl(name);
  return data.publicUrl;
}
function render(){
 let p=document.getElementById('preview');
 document.getElementById('count').innerText=gallery.length+' items';
 if(!gallery.length){p.innerHTML='<p style="opacity:.6">No items yet</p>';return;}
 let h='';
 for(let i=0;i<gallery.length;i++){
  let it=gallery[i];
  if(it.type==='image') h+=`<div><img src="${it.src}"><br>${it.title}<br><a style="color:#ef4444" onclick="delItem(${i})">Delete</a></div>`;
  else if(it.type==='video_blob') h+=`<div><video src="${it.src}" controls muted></video><br>${it.title}<br><a style="color:#ef4444" onclick="delItem(${i})">Delete</a></div>`;
  else h+=`<div><div style="background:#000;padding:30px 0">🎥 Video</div><br>${it.title}<br><a style="color:#ef4444" onclick="delItem(${i})">Delete</a></div>`;
 }
 p.innerHTML=h;
}
function renderProducts(){
 let p=document.getElementById('mentePreview');
 document.getElementById('prodCount').innerText=products.length+' items';
 if(!products.length){p.innerHTML='<p style="opacity:.6">No products</p>';return;}
 let h='';
 for(let i=0;i<products.length;i++){
  let it=products[i];
  let mainImg = it.img || (it.imgs && it.imgs[0]) || 'logo.png';
  let extraCount = it.imgs? it.imgs.length : 1;
  h+=`<div><img src="${mainImg}"><span class="mini-badge">${it.badge||'NEW'} ${extraCount>1?'('+extraCount+' imgs)':''}</span><br><b style="font-size:11px">${it.name}</b><br><span style="color:#22c55e;font-weight:800">₦${it.price}</span><br><a style="color:#38bdf8;margin-right:6px" onclick="editProduct(${i})">Edit</a><a style="color:#ef4444" onclick="delProduct(${i})">Delete</a></div>`;
 }
 p.innerHTML=h;
}
render(); renderProducts();

function compressImage(file){
 return new Promise((resolve)=>{
  if(file.size < 1500000){ resolve(file); return; }
  let r=new FileReader();
  r.onload=e=>{
   let img=new Image();
   img.onload=()=>{
    try{
     let c=document.createElement('canvas');
     let max=1000; let w=img.width,h=img.height;
     if(w>h){if(w>max){h=h*max/w;w=max;}}else{if(h>max){w=w*max/h;h=max;}}
     c.width=w;c.height=h;
     c.getContext('2d').drawImage(img,0,0,w,h);
     c.toBlob(b=>{ if(b) resolve(b); else resolve(file); }, 'image/jpeg', 0.7);
    }catch{ resolve(file); }
   };
   img.onerror=()=>{ resolve(file); };
   img.src=e.target.result;
  };
  r.onerror=()=>{ resolve(file); };
  r.readAsDataURL(file);
 });
}

function previewProdImages(input){
  let preview = document.getElementById('prodImgPreview');
  preview.innerHTML='';
  if(!input.files || input.files.length===0) return;
  let files = Array.from(input.files);
  files.forEach(f=>{
    let r=new FileReader();
    r.onload=e=>{
      let img=document.createElement('img');
      img.src=e.target.result;
      preview.appendChild(img);
    };
    r.readAsDataURL(f);
  });
}

async function addPictures(){
 let files=document.getElementById('picFiles').files;
 let title=document.getElementById('picTitle').value.trim()||'Project';
 let btn=document.getElementById('picBtn');
 let status=document.getElementById('picStatus');
 if(!files || files.length===0){status.innerText='Choose pictures first';return;}
 btn.disabled=true;
 try{
  let list = Array.from(files);
  for(let i=0;i<list.length;i++){
   btn.innerText='Uploading '+(i+1)+'/'+list.length+'...';
   let compressed = await compressImage(list[i]);
   let fileToUpload = compressed instanceof File? compressed : new File([compressed], list[i].name, {type:'image/jpeg'});
   let url = await uploadToSupabase(fileToUpload, 'gallery');
   gallery.unshift({type:'image',src:url,title:title});
  }
  save();
  document.getElementById('picFiles').value=''; document.getElementById('picTitle').value='';
  status.innerText='Saved '+list.length+' images';
 }catch(e){ status.innerText='Error: '+e.message; }
 btn.disabled=false; btn.innerText='Add Pictures';
}
function addYT(){
 let link=document.getElementById('ytLink').value.trim();
 let title=document.getElementById('ytTitle').value.trim()||'MSEL Video';
 if(!link){document.getElementById('vidStatus').innerText='Paste YouTube link';return;}
 let embed=link.includes('embed/')?link: link.replace('watch?v=','embed/').split('&')[0];
 gallery.unshift({type:'youtube',embed:embed,title:title});
 save(); document.getElementById('ytLink').value=''; document.getElementById('ytTitle').value='';
 document.getElementById('vidStatus').innerText='Saved';
}
async function addVideoFile(){
 let fileInput=document.getElementById('vidFile');
 let file=fileInput.files[0];
 let title=document.getElementById('vidTitle').value.trim()||'MSEL Video';
 let btn=document.getElementById('vidBtn');
 let status=document.getElementById('vidStatus');
 if(!file){status.innerText='Choose video file';return;}
 btn.disabled=true; btn.innerText='Uploading...';
 try{
  let url = await uploadToSupabase(file, 'gallery');
  gallery.unshift({type:'video_blob', src:url, title:title});
  save();
  fileInput.value=''; document.getElementById('vidTitle').value='';
  status.innerText='Saved';
 }catch(err){ status.innerText=err.message; }
 btn.disabled=false; btn.innerText='Upload Video File';
}

async function addProduct(){
 let n=document.getElementById('prodName').value.trim();
 let pr=document.getElementById('prodPrice').value.trim();
 let d=document.getElementById('prodDesc').value.trim();
 let badge=document.getElementById('prodBadge').value;
 let fileInput=document.getElementById('prodImage');
 let files=fileInput.files;
 let idx=parseInt(document.getElementById('editIndex').value);
 let btn=document.getElementById('prodBtn');
 let status=document.getElementById('prodStatus');
 if(!n||!pr){status.innerText='Enter name & price';return;}
 btn.disabled=true; btn.innerText='Saving...';
 try{
  let oldData = idx>-1? products[idx] : null;
  let imgUrls = [];
  if(files && files.length>0){
    let list = Array.from(files);
    for(let i=0;i<list.length && i<5;i++){
      status.innerText='Uploading image '+(i+1)+'/'+list.length+'...';
      let compressed = await compressImage(list[i]);
      let fileToUpload = compressed instanceof File? compressed : new File([compressed], list[i].name, {type:'image/jpeg'});
      let url = await uploadToSupabase(fileToUpload, 'products');
      imgUrls.push(url);
    }
  }
  if(imgUrls.length===0 && oldData){
    if(oldData.imgs && oldData.imgs.length>0){ imgUrls = [...oldData.imgs]; }
    else if(oldData.img){ imgUrls = [oldData.img]; }
  }
  let mainImg = imgUrls.length>0? imgUrls[0] : (oldData? (oldData.img || (oldData.imgs?oldData.imgs[0]:'')) : '');
  let savedId = oldData? oldData.id : null;
  try{
    let rowData = {name:n, price:pr, description:d, badge:badge, img:mainImg, imgs:imgUrls};
    if(idx>-1 && oldData && oldData.id){
      await supabaseClient.from('msel_products').update(rowData).eq('id', oldData.id);
      savedId = oldData.id;
    }else{
      let {data} = await supabaseClient.from('msel_products').insert(rowData).select();
      if(data && data[0]) savedId = data[0].id;
    }
  }catch(err){ console.log('table save failed', err.message); }
  let obj={id:savedId, name:n, price:pr, desc:d, badge:badge, img:mainImg, imgs:imgUrls};
  if(idx>-1) products[idx]=obj; else products.unshift(obj);
  saveProducts(); clearProdForm();
  status.innerText='Saved - visible in ALL browsers';
 }catch(e){ status.innerText='Error: '+e.message; }
 btn.disabled=false; btn.innerText='Add to Shop';
 document.getElementById('editIndex').value='-1';
}

function editProduct(i){
 let p=products[i];
 document.getElementById('prodName').value=p.name;
 document.getElementById('prodPrice').value=p.price;
 document.getElementById('prodDesc').value=p.desc||'';
 document.getElementById('prodBadge').value=p.badge||'NEW';
 document.getElementById('editIndex').value=i;
 document.getElementById('prodBtn').innerText='Save Changes';
 let preview=document.getElementById('prodImgPreview');
 preview.innerHTML='';
 let imgs = p.imgs && p.imgs.length>0? p.imgs : (p.img?[p.img]:[]);
 imgs.forEach(src=>{
   if(!src) return;
   let img=document.createElement('img');
   img.src=src;
   preview.appendChild(img);
 });
 window.scrollTo({top:0,behavior:'smooth'});
}

async function delProduct(i){
  if(!confirm('Delete?')) return;
  let p=products[i];
  try{ if(p.id) await supabaseClient.from('msel_products').delete().eq('id', p.id); }catch{}
  products.splice(i,1); saveProducts();
}

function clearProdForm(){
  document.getElementById('prodName').value='';
  document.getElementById('prodPrice').value='';
  document.getElementById('prodDesc').value='';
  document.getElementById('prodImage').value='';
  document.getElementById('prodImgPreview').innerHTML='';
  document.getElementById('editIndex').value='-1';
  document.getElementById('prodBtn').innerText='Add to Shop';
}
async function delItem(i){ gallery.splice(i,1); save(); }
async function clearGallery(){ if(confirm('Clear gallery?')){ gallery=[]; save(); } }
function logout(){localStorage.removeItem('msel_admin');localStorage.removeItem('msel_role');window.location.href='login.html';}

// FIXED GALLERY RESTORE - shows gallery in ALL browsers, skips products folder
(async function restoreGallery(){
 try{
  let changed=false;
  // 1. Load new gallery/ folder
  const {data: gFiles} = await supabaseClient.storage.from(BUCKET).list('gallery', {limit:100, sortBy:{column:'created_at', order:'desc'}});
  if(gFiles && gFiles.length>0){
    for(let f of gFiles){
      if(f.name==='.emptyFolderPlaceholder') continue;
      const {data} = supabaseClient.storage.from(BUCKET).getPublicUrl('gallery/'+f.name);
      if(!gallery.some(g=>g.src===data.publicUrl)){
        gallery.unshift({type:'image', src:data.publicUrl, title:f.name});
        changed=true;
      }
    }
  }
  // 2. Load OLD ROOT gallery images (to bring back your old gallery)
  const {data: rootFiles} = await supabaseClient.storage.from(BUCKET).list('', {limit:100, sortBy:{column:'created_at', order:'desc'}});
  if(rootFiles && rootFiles.length>0){
    for(let f of rootFiles){
      if(f.name==='.emptyFolderPlaceholder') continue;
      if(f.name==='gallery' || f.name==='products') continue;
      if(!f.metadata) continue; // skip folders
      const {data} = supabaseClient.storage.from(BUCKET).getPublicUrl(f.name);
      const url=data.publicUrl;
      // Skip if this image is already a product image
      if(products.some(p=>p.img===url || (p.imgs && p.imgs.includes(url)))) continue;
      if(!gallery.some(g=>g.src===url)){
        gallery.unshift({type:'image', src:url, title:f.name});
        changed=true;
      }
    }
  }
  if(changed){ localStorage.setItem('msel_gallery', JSON.stringify(gallery)); render(); }
 }catch(e){ console.log('gallery restore', e.message); }
})();

// Load existing products from table on start
(async function restoreProducts(){
 try{
  const {data} = await supabaseClient.from('msel_products').select('*').order('created_at',{ascending:false});
  if(data && data.length>0){
    products = data.map(r=>({id:r.id, name:r.name, price:r.price, desc:r.description||'', badge:r.badge||'NEW', img:r.img, imgs:r.imgs||[]}));
    localStorage.setItem('msel_products', JSON.stringify(products));
    renderProducts();
  }
 }catch(e){}
})();
</script>
</body>
</html>
