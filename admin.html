<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSEL Admin Panel</title>
<link rel="icon" href="logo.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f172a;color:#fff;padding:10px}
.top{background:#00924C;border-radius:14px;padding:14px;display:flex;justify-content:space-between;align-items:center}
.top a{background:#fff;color:#00924C;padding:8px 16px;border-radius:20px;text-decoration:none;font-weight:800;font-size:13px}
.box{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:16px;margin-top:12px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;margin-top:8px}
button{width:100%;padding:12px;border-radius:10px;border:0;background:#22c55e;color:#0f172a;font-weight:800;margin-top:10px;cursor:pointer}
.preview{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:10px}
.preview div{background:#0f172a;border-radius:10px;overflow:hidden;border:1px solid #334155;padding-bottom:6px;text-align:center;font-size:11px}
.preview img{width:100%;height:100px;object-fit:cover}
</style>
</head>
<body>
<div class="top">
<h2>🔐 MSEL ADMIN<br><small style="font-size:12px">9 Images Batch Upload</small></h2>
<a href="index.html">🏠 Homepage</a>
</div>

<div class="box">
<h3>📸 Upload 9 Images AT ONCE</h3>
<p style="font-size:12px;opacity:.7">Select all 9 images together → Title → Add</p>
<input type="file" id="picFiles" multiple accept="image/*">
<input type="text" id="picTitle" placeholder="Title e.g. 1 Cubic Meter Biogas">
<button onclick="addPictures()">Add All Pictures (9 at once)</button>
<p id="status" style="font-size:12px;margin-top:8px;color:#22c55e"></p>
</div>

<div class="box">
<h3>🖼️ Current Gallery - <span id="count">0</span> items</h3>
<div id="preview" class="preview"></div>
<button onclick="clearGallery()" style="background:#ef4444;color:#fff;margin-top:12px">🗑️ Clear All</button>
</div>

<a href="index.html" style="display:block;text-align:center;background:#fff;color:#00924C;padding:12px;border-radius:10px;text-decoration:none;font-weight:800;margin-top:12px">🏠 Go to Homepage - See Gallery</a>

<script>
let gallery=JSON.parse(localStorage.getItem('msel_gallery')||'[]');
function save(){localStorage.setItem('msel_gallery',JSON.stringify(gallery));render();}
function render(){
 document.getElementById('count').innerText=gallery.length;
 let p=document.getElementById('preview');
 if(!gallery.length){p.innerHTML='<p style="opacity:.6">No items</p>';return;}
 p.innerHTML=gallery.map((it,i)=>`<div><img src="${it.src}"><div style="padding:4px">${it.title}</div><a style="color:#ef4444;cursor:pointer" onclick="delItem(${i})">Delete</a></div>`).join('');
}
render();

async function compressImage(file){
 return new Promise(res=>{
  let r=new FileReader();
  r.onload=e=>{
   let img=new Image();
   img.onload=()=>{
    let c=document.createElement('canvas');
    let max=500; let w=img.width,h=img.height;
    if(w>h){if(w>max){h=h*max/w;w=max;}}else{if(h>max){w=w*max/h;h=max;}}
    c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    res(c.toDataURL('image/jpeg',0.45));
   };
   img.src=e.target.result;
  };
  r.readAsDataURL(file);
 });
}

async function addPictures(){
 let files=document.getElementById('picFiles').files;
 let title=document.getElementById('picTitle').value||'1 Cubic Meter Biogas';
 if(!files.length){alert('Choose 9 images first');return;}
 document.getElementById('status').innerText='Compressing '+files.length+' images... please wait...';
 let newItems=[];
 for(let i=0;i<files.length;i++){
  let compressed=await compressImage(files[i]);
  newItems.push({type:'image',src:compressed,title:title});
  document.getElementById('status').innerText='Compressed '+(i+1)+'/'+files.length;
 }
 gallery=gallery.concat(newItems);
 try{
  localStorage.setItem('msel_gallery',JSON.stringify(gallery));
  render();
  document.getElementById('status').innerText='✅ '+newItems.length+' images added! Go to Homepage now.';
  alert(newItems.length+' images added at once! Now your gallery will show all '+gallery.length);
  document.getElementById('picFiles').value='';
 }catch(e){
  alert('Storage full! You added too many big images. Clear gallery and try 4-5 at a time. Error: '+e.message);
  gallery=gallery.slice(0,gallery.length-newItems.length);
 }
}
function delItem(i){gallery.splice(i,1);save();}
function clearGallery(){if(confirm('Clear all gallery?')){gallery=[];save();document.getElementById('status').innerText='Cleared';}}
</script>
</body>
</html>
