<script>
function addPictures(){
 let files=document.getElementById('picFiles').files;
 let title=document.getElementById('picTitle').value||'MSEL Project';
 if(!files.length){alert('Choose pictures');return;}
 let count=0;
 Array.from(files).forEach(file=>{
  let r=new FileReader();
  r.onload=e=>{
   let img=new Image();
   img.onload=()=>{
    let canvas=document.createElement('canvas');
    let max=600; let w=img.width; let h=img.height;
    if(w>max){h=h*max/w; w=max;}
    if(h>max){w=w*max/h; h=max;}
    canvas.width=w; canvas.height=h;
    canvas.getContext('2d').drawImage(img,0,0,w,h);
    let compressed=canvas.toDataURL('image/jpeg',0.5);
    gallery.push({type:'image',src:compressed,title:title});
    localStorage.setItem('msel_gallery',JSON.stringify(gallery));
    count++; if(count==files.length){render(); alert(count+' compressed images added! Now they will fit!');}
   };
   img.src=e.target.result;
  };
  r.readAsDataURL(file);
 });
}
</script>
