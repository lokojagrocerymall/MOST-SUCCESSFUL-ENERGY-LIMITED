<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSEL Admin Panel</title>
<link rel="icon" href="logo.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f172a;color:#fff;padding:10px}
.top{background:#00924C;border-radius:14px;padding:14px;display:flex;justify-content:space-between;align-items:center}
.top h2{font-size:18px;line-height:1.2}
.top a{background:#fff;color:#00924C;padding:8px 16px;border-radius:20px;text-decoration:none;font-weight:800;font-size:13px}
.box{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:16px;margin-top:12px}
.box h3{font-size:16px;margin-bottom:10px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;margin-top:8px}
button{width:100%;padding:12px;border-radius:10px;border:0;background:#22c55e;color:#0f172a;font-weight:800;margin-top:10px;cursor:pointer}
button:disabled{opacity:.5}
.btn-orange{background:#f97316;color:#fff}
.preview{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-top:10px}
.preview div{background:#0f172a;border-radius:10px;overflow:hidden;border:1px solid #334155;padding-bottom:6px;text-align:center;font-size:11px}
.preview img,.preview video{width:100%;height:90px;object-fit:cover}
</style>
</head>
<body>

<div class="top">
<h2>🔐 MSEL ADMIN PANEL<br><small style="font-weight:400;font-size:12px;opacity:.9">Pictures & Videos Upload</small></h2>
<a href="index.html">🏠 Homepage</a>
</div>

<div class="box">
<h3>📸 Upload Pictures</h3>
<input type="file" id="picFiles" multiple accept="image/*">
<input type="text" id="picTitle" placeholder="Title e.g. Maryland Project">
<button id="picBtn" onclick="addPictures()">Add Pictures</button>
<small id="picStatus" style="display:block;margin-top:6px;color:#94a3b8"></small>
</div>

<div class="box">
<h3>🎥 Add YouTube Video</h3>
<input type="text" id="ytLink" placeholder="YouTube Link">
<input type="text" id="ytTitle" placeholder="Video Title">
<button class="btn-orange" onclick="addYT()">Add YouTube Video</button>
<p style="margin-top:12px;font-size:14px">Or Upload Video File (Now works even for 50MB!)</p>
<input type="file" id="vidFile" accept="video/*">
<input type="text" id="vidTitle" placeholder="Video Title">
<button id="vidBtn" onclick="addVideoFile()">Upload Video File</button>
<small id="vidStatus" style="display:block;margin-top:6px;color:#94a3b8"></small>
</div>

<div class="box">
<h3>📦 Add New Material (WhatsApp catalog)</h3>
<input type="text" id="prodName" placeholder="Product Name">
<input type="text" id="prodPrice" placeholder="Price e.g. 250000">
<input type="text" id="prodDesc" placeholder="Description">
<button onclick="addProduct()">Add to Engineers Shop</button>
</div>

<div class="box">
<h3>🖼️ Current Gallery Preview - <span id="count">0 items</span></h3>
<div id="preview" class="preview"></div>
<button onclick="clearGallery()" style="background:#ef4444;color:#fff;margin-top:12px">🗑️ Clear All Gallery</button>
</div>

<button onclick="logout()" style="background:#ef4444;color:#fff;margin:12px 0">Logout</button>
<a href="index.html" style="display:block;text-align:center;background:#fff;color:#00924C;padding:12px;border-radius:10px;text-decoration:none;font-weight:800">🏠 Go to Homepage</a>

<script>
let gallery = JSON.parse(localStorage.getItem('msel_gallery')||'[]');
let products = JSON.parse(localStorage.getItem('msel_products')||'[]');

function save(){localStorage.setItem('msel_gallery',JSON.stringify(gallery));render();}
async function render(){
 let p=document.getElementById('preview');
 document.getElementById('count').innerText=gallery.length+' items';
 if(!gallery.length){p.innerHTML='<p style="opacity:.6">No items - upload now</p>';return;}
 let h='';
 for(let i=0;i<gallery.length;i++){
  let it=gallery[i];
  if(it.type==='image') h+=`<div><img src="${it.src}"><br>${it.title}<br><a style="color:#ef4444" onclick="delItem(${i})">Delete</a></div>`;
  else if(it.type==='video_blob'){
   let blobUrl=await getVideoBlobUrl(it.vidId);
   h+=`<div><video src="${blobUrl}" muted></video><br>${it.title}<br><a style="color:#ef4444" onclick="delItem(${i})">Delete</a></div>`;
  }
  else h+=`<div><div style="background:#000;padding:30px 0">🎥 ${it.type}</div><br>${it.title}<br><a style="color:#ef4444" onclick="delItem(${i})">Delete</a></div>`;
 }
 p.innerHTML=h;
}
render();

// INDEXEDDB FOR VIDEO - NO MORE BASE64 CRASH
function openDB(){
 return new Promise((res,rej)=>{
  let req=indexedDB.open('mselDB',1);
  req.onupgradeneeded=e=>{ e.target.result.createObjectStore('videos',{keyPath:'id'}); };
  req.onsuccess=e=>res(e.target.result);
  req.onerror=e=>rej(e);
 });
}
function saveVideoBlob(id, file){
 return new Promise(async (res,rej)=>{
  let db=await openDB();
  let tx=db.transaction('videos','readwrite');
  tx.objectStore('videos').put({id:id, blob:file});
  tx.oncomplete=()=>res();
  tx.onerror=()=>rej();
 });
}
function getVideoBlobUrl(id){
 return new Promise(async (res)=>{
  try{
   let db=await openDB();
   let tx=db.transaction('videos','readonly');
   let req=tx.objectStore('videos').get(id);
   req.onsuccess=()=>{ if(req.result) res(URL.createObjectURL(req.result.blob)); else res(''); };
  }catch{ res(''); }
 });
}
function deleteVideoBlob(id){
 return new Promise(async (res)=>{
  let db=await openDB();
  let tx=db.transaction('videos','readwrite');
  tx.objectStore('videos').delete(id);
  tx.oncomplete=()=>res();
 });
}

function compressImage(file){
 return new Promise((resolve,reject)=>{
  let r=new FileReader();
  r.onload=e=>{
   let img=new Image();
   img.onload=()=>{
    try{
     let c=document.createElement('canvas');
     let max=700; let w=img.width,h=img.height;
     if(w>h){if(w>max){h=h*max/w;w=max;}}else{if(h>max){w=w*max/h;h=max;}}
     c.width=w;c.height=h;
     c.getContext('2d').drawImage(img,0,0,w,h);
     resolve(c.toDataURL('image/jpeg',0.5));
    }catch(err){reject(err);}
   };
   img.onerror=()=>reject('Image corrupt');
   img.src=e.target.result;
  };
  r.onerror=()=>reject('Failed');
  r.readAsDataURL(file);
 });
}

async function addPictures(){
 let files=document.getElementById('picFiles').files;
 let title=document.getElementById('picTitle').value.trim()||'Certified training';
 let btn=document.getElementById('picBtn');
 let status=document.getElementById('picStatus');
 if(!files.length){alert('Choose pictures first');return;}
 btn.disabled=true;
 status.innerText='Compressing...';
 try{
  let newItems=[];
  for(let i=0;i<files.length;i++){
   btn.innerText='Compressing '+(i+1)+'/'+files.length;
   let compressed=await compressImage(files[i]);
   newItems.push({type:'image',src:compressed,title:title});
  }
  let temp=gallery.concat(newItems);
  localStorage.setItem('msel_gallery',JSON.stringify(temp));
  gallery=temp; render();
  alert(newItems.length+' pictures added!');
  document.getElementById('picFiles').value=''; document.getElementById('picTitle').value='';
  status.innerText=newItems.length+' added ✓'; status.style.color='#22c55e';
 }catch(e){ alert('Error: '+e+' - Try clear gallery and add 3 at a time'); status.innerText='Failed'; }
 btn.disabled=false; btn.innerText='Add Pictures';
}

function addYT(){
 let link=document.getElementById('ytLink').value.trim();
 let title=document.getElementById('ytTitle').value.trim()||'MSEL Video';
 if(!link){alert('Paste YouTube link');return;}
 let embed=link.includes('embed/')?link: link.replace('watch?v=','embed/').split('&')[0];
 gallery.push({type:'youtube',embed:embed,title:title});
 try{ save(); alert('YouTube added!'); document.getElementById('ytLink').value=''; document.getElementById('ytTitle').value=''; }catch(e){ gallery.pop(); alert('Storage full! Clear gallery'); }
}

// NEW VIDEO UPLOAD - NO BASE64, NO CRASH
async function addVideoFile(){
 let fileInput=document.getElementById('vidFile');
 let file=fileInput.files[0];
 let title=document.getElementById('vidTitle').value.trim()||'Review shared by those who attended our just concluded training';
 let btn=document.getElementById('vidBtn');
 let status=document.getElementById('vidStatus');
 if(!file){alert('Choose video file');return;}
 btn.disabled=true;
 btn.innerText='Uploading... please wait...';
 status.innerText='Saving video file (no base64)...';
 try{
  let vidId=Date.now();
  await saveVideoBlob(vidId, file);
  gallery.push({type:'video_blob', vidId:vidId, title:title});
  localStorage.setItem('msel_gallery',JSON.stringify(gallery));
  render();
  alert('Video uploaded! Size: '+(file.size/1024/1024).toFixed(2)+'MB - Success!');
  fileInput.value=''; document.getElementById('vidTitle').value='';
  status.innerText='Video saved ✓'; status.style.color='#22c55e';
 }catch(err){
  alert('Failed to save video: '+err.message+' - Your browser may not support IndexedDB');
  status.innerText='Failed - try Chrome'; status.style.color='#f87171';
 }
 btn.disabled=false; btn.innerText='Upload Video File';
}

function addProduct(){
 let n=document.getElementById('prodName').value;
 let pr=document.getElementById('prodPrice').value;
 let d=document.getElementById('prodDesc').value;
 if(!n||!pr){alert('Enter name & price');return;}
 products.push({name:n,price:pr,desc:d,badge:'NEW'});
 localStorage.setItem('msel_products',JSON.stringify(products));
 alert(n+' added!'); document.getElementById('prodName').value='';document.getElementById('prodPrice').value='';document.getElementById('prodDesc').value='';
}
async function delItem(i){
 let it=gallery[i];
 if(it.type==='video_blob' && it.vidId) await deleteVideoBlob(it.vidId);
 gallery.splice(i,1); save();
}
async function clearGallery(){
 if(confirm('Clear all?')){
  // clear videos from IndexedDB too
  let db=await openDB();
  let tx=db.transaction('videos','readwrite');
  tx.objectStore('videos').clear();
  gallery=[]; save(); alert('All cleared! You can now upload that 1000134556.mp4');
 }
}
function logout(){localStorage.removeItem('msel_admin');localStorage.removeItem('msel_role');window.location.href='login.html';}
</script>
</body>
</html>
