<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create MENTE Account - MSEL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#4a0a4a;color:#fff;min-height:100vh;padding:12px;display:flex;flex-direction:column}
.top{background:#000;color:#fff;padding:10px 14px;border-radius:10px;display:flex;justify-content:space-between;align-items:center}
.top h2{font-size:14px}
.top a{color:#fff;text-decoration:none;font-size:13px;background:#333;padding:6px 12px;border-radius:20px}
.card{background:#fff;color:#111;border-radius:18px;padding:18px;margin:14px auto;max-width:400px;width:100%;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.card h1{text-align:center;color:#4a0a4a;font-size:20px;margin-bottom:14px}
label{font-size:12px;font-weight:800;margin-top:12px;display:block;color:#333}
input{width:100%;padding:13px;border-radius:10px;border:1.5px solid #ddd;margin-top:6px;outline:none;font-size:14px}
input:focus{border-color:#4a0a4a}
button.main{width:100%;padding:14px;border-radius:12px;border:0;background:#22c55e;color:#000;font-weight:900;font-size:15px;margin-top:18px;cursor:pointer}
button.main:disabled{opacity:.5}
.error{background:#fee2e2;color:#991b1b;padding:10px;border-radius:8px;font-size:12px;margin-top:10px;display:none}
.success{background:#dcfce7;color:#14532d;padding:10px;border-radius:8px;font-size:12px;margin-top:10px;display:none}
.logo-wrap{text-align:center;margin-bottom:12px}
.logo-wrap img{max-width:140px}
.bottom-links{text-align:center;margin-top:16px;font-size:12px}
.bottom-links a{color:#4a0a4a;font-weight:800;text-decoration:none}
</style>
</head>
<body>

<div class="top">
<h2>🔐 MSEL MENTE REGISTER</h2>
<a href="index.html">🏠 Home</a>
</div>

<div class="card">
<div class="logo-wrap"><img src="logo.png" alt="MSEL"></div>
<h1>Create MENTE Account</h1>

<label>Full Name / Company Name</label>
<input type="text" id="fullName" placeholder="" maxlength="60">

<label>Phone Number</label>
<input type="tel" id="phone" placeholder="" inputmode="numeric" maxlength="11">

<div id="errorMsg" class="error"></div>
<div id="successMsg" class="success"></div>

<button id="createBtn" class="main" onclick="createAccount()">Create Account & Enter Chat</button>

<div class="bottom-links">
Already have account? <a href="mente-login.html">Login Here</a>
</div>
</div>

<script>
const SUPABASE_URL = 'https://rsnsciisycruhxtvfhwb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_s38AGGB3mnHpRMIDkVsfow_bs-Fz00g';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const fullNameEl = document.getElementById('fullName');
const phoneEl = document.getElementById('phone');
const errorMsg = document.getElementById('errorMsg');
const successMsg = document.getElementById('successMsg');
const btn = document.getElementById('createBtn');

phoneEl.addEventListener('input', ()=>{
  let v = phoneEl.value.replace(/[^0-9]/g,'');
  if(v.length > 11) v = v.slice(0,11);
  phoneEl.value = v;
});

function showError(txt){ errorMsg.innerText=txt; errorMsg.style.display='block'; successMsg.style.display='none'; }
function showSuccess(txt){ successMsg.innerText=txt; successMsg.style.display='block'; errorMsg.style.display='none'; }

async function createAccount(){
  let full_name = fullNameEl.value.trim();
  let phone = phoneEl.value.trim().replace(/\s+/g,'');

  errorMsg.style.display='none';

  if(full_name.length < 3){ showError('❌ Enter full name'); return; }
  if(!/^[0-9]+$/.test(phone)){ showError('❌ Phone must be numbers only'); return; }
  if(phone.length < 10 || phone.length > 11){ showError('❌ Phone must be 10 or 11 digits'); return; }
  if(!phone.startsWith('0')){ showError('❌ Phone must start with 0'); return; }

  btn.disabled=true; btn.innerText='⏳ Checking...';

  try{
    const {data: existing} = await supabaseClient.from('msel_mente_accounts').select('phone').eq('phone', phone).limit(1);
    if(existing && existing.length>0){
      showError('❌ This phone already registered. Use Login.');
      btn.disabled=false; btn.innerText='Create Account & Enter Chat'; return;
    }

    btn.innerText='⏳ Creating...';
    const {error} = await supabaseClient.from('msel_mente_accounts').insert({
      name: full_name,
      full_name: full_name,
      phone: phone,
      status: 'pending',
      approval_status: 'pending',
      created_at: new Date().toISOString()
    });
    if(error) throw error;

    showSuccess('✅ Account created! Redirecting...');
    setTimeout(()=>{ window.location.href='mente-chat.html?phone='+encodeURIComponent(phone); }, 800);

  }catch(e){
    if(e.message.includes('unique_phone') || e.message.includes('duplicate')){ showError('❌ Phone already exists. Use Login.'); }
    else { showError('❌ '+e.message); }
    btn.disabled=false; btn.innerText='Create Account & Enter Chat';
  }
}
</script>
</body>
</html>
