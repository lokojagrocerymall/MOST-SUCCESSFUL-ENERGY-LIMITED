<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSEL MENTE - Engineers Shop</title>
<link rel="icon" href="logo.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f172a;color:#fff;padding:12px}
.header{background:#00924C;border-radius:14px;padding:16px;display:flex;justify-content:space-between;align-items:center}
.header img{height:40px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:15px}
.card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:14px;text-align:center;position:relative}
.card img{width:100%;height:110px;object-fit:contain;background:#fff;border-radius:10px;padding:8px}
.badge{position:absolute;top:8px;left:8px;background:#22c55e;color:#0f172a;font-size:10px;padding:4px 8px;border-radius:20px;font-weight:800}
.price{color:#22c55e;font-weight:900;margin-top:6px;font-size:18px}
.btn{width:100%;padding:10px;border-radius:10px;border:0;background:#22c55e;color:#0f172a;font-weight:800;margin-top:8px;cursor:pointer}
.btn-wa{background:#25D366;color:#fff}
</style>
</head>
<body>
<div class="header">
<div style="display:flex;align-items:center;gap:10px"><img src="logo.png" alt="MSEL"><div><b>MSEL MENTE</b><br><small style="opacity:.8">Engineers Private Shop</small></div></div>
<a href="index.html" style="background:#fff;color:#00924C;padding:8px 14px;border-radius:20px;text-decoration:none;font-weight:800;font-size:12px">Home</a>
</div>

<div id="shopGrid" class="grid"></div>

<div style="text-align:center;margin:20px 0">
<a id="orderAllBtn" href="https://wa.me/2347011620564?text=Hi%20MSEL,%20I%20want%20to%20order%20materials" style="background:#25D366;color:#fff;padding:14px 28px;border-radius:30px;text-decoration:none;font-weight:800;display:inline-block">💬 Order All on WhatsApp</a>
<br><br>
<button onclick="logout()" style="background:#ef4444;color:#fff;padding:10px 20px;border-radius:20px;border:0;font-weight:800">Logout</button>
</div>

<script>
let defaultProducts=[
 {name:"10,000L Storage Bag",price:"250000",desc:"Big industrial bag for biogas storage",badge:"BIG STORAGE",img:""},
 {name:"Biodigester Bag 1M³",price:"85000",desc:"High density digester bag",badge:"HOT",img:""},
 {name:"Bio-Enzyme (Bacteria)",price:"15000",desc:"Bacteria for fast decomposition",badge:"NEW",img:""},
 {name:"PVC Pipes & Fittings Kit",price:"35000",desc:"Complete PVC kit",badge:"KIT",img:""},
 {name:"Air Vent & Cover",price:"8000",desc:"Odorless vent system",badge:"VENT",img:""},
 {name:"1M³ Digester Complete Kit",price:"180000",desc:"Everything for 1M³ system",badge:"COMPLETE",img:""},
 {name:"Sealant & Additives",price:"12000",desc:"Waterproof sealant",badge:"SEAL",img:""},
 {name:"WC Connector",price:"6000",desc:"Toilet to digester connector",badge:"WC",img:""},
];

let adminProducts = JSON.parse(localStorage.getItem('msel_products')||'[]');
let allProducts = adminProducts.length>0 ? adminProducts : defaultProducts;

if(adminProducts.length===0){
  localStorage.setItem('msel_products',JSON.stringify(defaultProducts));
  allProducts = defaultProducts;
}

let grid=document.getElementById('shopGrid');

let html='';
allProducts.forEach(p=>{
 let imgSrc = p.img && p.img.length>10 ? p.img : 'logo.png';
 html+=`
 <div class="card">
 <span class="badge">${p.badge||'NEW'}</span>
 <img src="${imgSrc}" alt="${p.name}">
 <div style="font-weight:800;font-size:13px;margin-top:8px;min-height:32px">${p.name}</div>
 <div style="font-size:11px;opacity:.6;margin-top:4px;min-height:28px">${p.desc||'MSEL Material'}</div>
 <div class="price">₦${p.price}</div>
 <button class="btn" onclick="order('${p.name}','${p.price}')">Order Now</button>
 <button class="btn btn-wa" onclick="order('${p.name}','${p.price}')">WhatsApp</button>
 </div>
 `;
});
grid.innerHTML=html;

let allText = allProducts.map(x=>`- ${x.name} ₦${x.price}`).join('%0A');
document.getElementById('orderAllBtn').href=`https://wa.me/2347011620564?text=Hi%20MSEL,%20I%20want%20to%20order%20materials:%0A${allText}`;

function order(name,price){
 let msg=`Hi MSEL, I want to order ${name} - ₦${price}. I am an MSEL MENTE engineer. My code is ${localStorage.getItem('msel_eng_code')||''}`;
 window.open(`https://wa.me/2347011620564?text=${encodeURIComponent(msg)}`,'_blank');
}
function logout(){localStorage.removeItem('msel_role');localStorage.removeItem('msel_engineer');localStorage.removeItem('msel_admin');localStorage.removeItem('msel_eng_code');window.location.href='login.html';}
</script>
</body>
</html>
