<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSEL MENTE - Engineers Private Shop</title>
<link rel="icon" href="logo.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f172a;color:#fff}
.top{background:#00924C;padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.top b{font-size:15px}
.top a{background:#fff;color:#00924C;padding:6px 14px;border-radius:20px;text-decoration:none;font-weight:800;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:10px;text-align:center}
.card img{width:100%;height:120px;object-fit:contain;background:#fff;border-radius:10px}
.badge{display:inline-block;background:#22c55e;color:#000;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:800;margin-top:6px}
.name{font-size:13px;font-weight:800;margin-top:6px;min-height:32px}
.desc{font-size:11px;opacity:.7;min-height:28px;margin:4px 0}
.price{color:#22c55e;font-weight:800;margin:6px 0}
.btn{width:100%;padding:8px;border-radius:8px;border:0;background:#22c55e;color:#000;font-weight:800;font-size:12px;margin-top:4px;cursor:pointer}
.btn2{background:#334155;color:#fff}
.logout{display:block;margin:10px auto;background:#ef4444;color:#fff;border:0;padding:10px 24px;border-radius:20px;font-weight:800}
</style>
</head>
<body>
<div class="top">
<div style="display:flex;align-items:center;gap:8px"><img src="logo.png" style="width:32px;height:32px;background:#fff;border-radius:6px"><div><b>MSEL MENTE</b><br><small>Engineers Private Shop</small></div></div>
<a href="index.html">Home</a>
</div>

<div id="grid" class="grid">Loading products...</div>
<button class="btn" style="width:auto;margin:12px auto;display:block;background:#22c55e" onclick="orderAll()">💬 Order All on WhatsApp</button>
<button class="logout" onclick="logout()">Logout</button>

<script>
const SUPABASE_URL='https://rsnsciisycruhxtvfhwb.supabase.co';
const SUPABASE_KEY='sb_publishable_s38AGGB3mnHpRMIDkVsfow_bs-Fz00g';
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const BUCKET='msel-project';

async function loadProducts(){
 let grid=document.getElementById('grid');
 let products=[];

 // 1. TRY SUPABASE TABLE FIRST - This fixes new browser issue
 try{
  const {data, error}=await supabaseClient.from('msel_products').select('*').order('created_at',{ascending:false});
  if(!error && data && data.length>0){
    products=data.map(r=>({name:r.name, price:r.price, desc:r.description||r.desc||'', badge:r.badge||'NEW', img:r.img, imgs:r.imgs||[]}));
  }
 }catch(e){ console.log('table not ready', e.message); }

 // 2. FALLBACK TO LOCAL STORAGE - This is what you use now
 if(products.length===0){
   try{
     let local=JSON.parse(localStorage.getItem('msel_products')||'[]');
     if(local && local.length>0) products=local;
   }catch{}
 }

 if(products.length===0){
   grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px 10px;opacity:.6">No products yet<br>Go to Admin to add<br><small style="font-size:11px">If you just created table, add 1 product again in Admin</small></div>';
   return;
 }

 let h='';
 products.forEach(p=>{
   let mainImg = p.img || (p.imgs && p.imgs[0]) || 'logo.png';
   let count = p.imgs? p.imgs.length : 0;
   h+=`<div class="card"><img src="${mainImg}" onerror="this.src='logo.png'"><div class="badge">${p.badge||'NEW'}${count>1?' ('+count+')':''}</div><div class="name">${p.name}</div><div class="desc">${p.desc||''}</div><div class="price">₦${p.price}</div><button class="btn" onclick="orderOne('${p.name.replace(/'/g,"")}','${p.price}')">Order Now</button><button class="btn btn2" onclick="orderOne('${p.name.replace(/'/g,"")}','${p.price}')">WhatsApp</button></div>`;
 });
 grid.innerHTML=h;
 // Save to local so old Chrome also gets new data next time
 try{ localStorage.setItem('msel_products', JSON.stringify(products)); }catch{}
}

function orderOne(name,price){
 window.open('https://wa.me/2348034623421?text='+encodeURIComponent('Hello MSEL, I want '+name+' - ₦'+price),'_blank');
}
function orderAll(){
 window.open('https://wa.me/2348034623421?text='+encodeURIComponent('Hello MSEL, I want to order biogas materials'),' _blank');
}
function logout(){ localStorage.removeItem('msel_role'); window.location.href='login.html'; }

loadProducts();
</script>
</body>
</html>
