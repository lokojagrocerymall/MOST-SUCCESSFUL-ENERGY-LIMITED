<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSEL MENTE Chat</title>
<link rel="icon" href="logo.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f172a;color:#fff;display:flex;flex-direction:column;height:100vh}
.header{background:#00924C;padding:12px;display:flex;justify-content:space-between;align-items:center}
.chat-box{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;background:#111b2f}
.msg{background:#1e293b;padding:10px 14px;border-radius:14px;max-width:85%;border:1px solid #334155}
.msg.me{align-self:flex-end;background:#00924C;border-color:#22c55e}
.msg.name{font-size:11px;font-weight:800;color:#22c55e;margin-bottom:4px}
.msg.me.name{color:#fff}
.msg.text{font-size:14px;line-height:1.4}
.msg.time{font-size:10px;opacity:.5;margin-top:4px;text-align:right}
.input-area{background:#1e293b;padding:10px;display:flex;gap:8px;border-top:1px solid #334155}
.input-area input{flex:1;padding:12px;border-radius:25px;border:1px solid #334155;background:#0f172a;color:#fff;outline:none}
.input-area button{padding:12px 18px;border-radius:25px;border:0;background:#22c55e;color:#0f172a;font-weight:800;cursor:pointer}
.tag{color:#22c55e;font-weight:800}
.update-banner{background:#f59e0b;color:#000;padding:10px;text-align:center;font-weight:800;font-size:13px;display:none}
</style>
</head>
<body>
<div class="header">
<div><b>MSEL MENTE CHAT</b><br><small id="userLabel" style="opacity:.8">Engineer</small></div>
<div style="display:flex;gap:8px">
<a href="engineers.html" style="background:#fff;color:#00924C;padding:6px 12px;border-radius:20px;text-decoration:none;font-size:12px;font-weight:800">Shop</a>
<a href="index.html" style="background:#1e293b;color:#fff;padding:6px 12px;border-radius:20px;text-decoration:none;font-size:12px">Home</a>
</div>
</div>
<div id="updateBanner" class="update-banner"></div>
<div id="chatBox" class="chat-box"></div>
<div class="input-area">
<input id="msgInput" placeholder="Type message, use @name to tag...">
<button onclick="sendMsg()">Send</button>
</div>

<script>
const SUPABASE_URL = 'https://rsnsciisycruhxtvfhwb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_s38AGGB3mnHpRMIDkVsfow_bs-Fz00g';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let myName = localStorage.getItem('msel_engineer') || localStorage.getItem('msel_eng_code') || 'Mente-'+Math.floor(Math.random()*1000);
let myCode = localStorage.getItem('msel_eng_code') || myName;
document.getElementById('userLabel').innerText = myName + ' ('+myCode+')';

async function loadUpdates(){
  try{
    const {data} = await supabaseClient.from('msel_updates').select('*').gt('expires_at', new Date().toISOString()).order('created_at',{ascending:false}).limit(1);
    if(data && data.length){
      let banner = document.getElementById('updateBanner');
      banner.style.display='block';
      banner.innerText = '📢 '+data[0].title+': '+data[0].message;
    }
  }catch{}
}
loadUpdates();

async function loadChat(){
  const {data} = await supabaseClient.from('msel_chat').select('*').order('created_at',{ascending:true}).limit(100);
  let box = document.getElementById('chatBox');
  if(!data) return;
  box.innerHTML='';
  data.forEach(m=>{
    let isMe = m.code===myCode || m.name===myName;
    let text = m.message.replace(/@(\w+)/g,'<span class="tag">@$1</span>');
    box.innerHTML+=`<div class="msg ${isMe?'me':''}"><div class="name">${m.name} • ${m.code}</div><div class="text">${text}</div><div class="time">${new Date(m.created_at).toLocaleTimeString()}</div></div>`;
  });
  box.scrollTop = box.scrollHeight;
}
loadChat();

async function sendMsg(){
  let input = document.getElementById('msgInput');
  let txt = input.value.trim();
  if(!txt) return;
  input.value='';
  await supabaseClient.from('msel_chat').insert({name:myName, code:myCode, message:txt});
  loadChat();
}

document.getElementById('msgInput').addEventListener('keydown',e=>{ if(e.key==='Enter') sendMsg(); });

// Realtime
supabaseClient.channel('chat-room').on('postgres_changes',{event:'INSERT',schema:'public',table:'msel_chat'},()=>{loadChat();}).subscribe();

setInterval(loadChat, 5000);
</script>
</body>
</html>
